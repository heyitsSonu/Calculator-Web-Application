<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">

    <!-- Calculator -->
    <main class="calculator glass" aria-label="Calculator">
      <header class="calc-top">
        <span class="brand">Calculator</span>
        <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Switch to light theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <section class="screen" aria-label="Display">
        <div id="expression" class="expression" aria-label="Previous calculation"></div>
        <output id="display" class="display" data-size="lg">0</output>
      </section>

      <section id="keypad" class="keypad" aria-label="Calculator keys">
        <button class="key key--func" data-action="clear" type="button">AC</button>
        <button class="key key--func" data-action="delete" type="button" aria-label="Delete">⌫</button>
        <button class="key key--func" data-action="percent" type="button" aria-label="Percent">%</button>
        <button class="key key--op" data-action="operator" data-value="/" type="button" aria-label="Divide">÷</button>

        <button class="key" data-action="digit" data-value="7" type="button">7</button>
        <button class="key" data-action="digit" data-value="8" type="button">8</button>
        <button class="key" data-action="digit" data-value="9" type="button">9</button>
        <button class="key key--op" data-action="operator" data-value="*" type="button" aria-label="Multiply">×</button>

        <button class="key" data-action="digit" data-value="4" type="button">4</button>
        <button class="key" data-action="digit" data-value="5" type="button">5</button>
        <button class="key" data-action="digit" data-value="6" type="button">6</button>
        <button class="key key--op" data-action="operator" data-value="-" type="button" aria-label="Subtract">−</button>

        <button class="key" data-action="digit" data-value="1" type="button">1</button>
        <button class="key" data-action="digit" data-value="2" type="button">2</button>
        <button class="key" data-action="digit" data-value="3" type="button">3</button>
        <button class="key key--op" data-action="operator" data-value="+" type="button" aria-label="Add">+</button>

        <button class="key key--func" data-action="sign" type="button" aria-label="Toggle positive or negative">+/−</button>
        <button class="key" data-action="digit" data-value="0" type="button">0</button>
        <button class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button>
        <button class="key key--eq" data-action="equals" type="button" aria-label="Equals">=</button>
      </section>
    </main>

    <!-- History -->
    <aside class="history glass" aria-label="Calculation history">
      <header class="history-top">
        <h2>History</h2>
        <button id="clear-history" class="text-btn" type="button">Clear</button>
      </header>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="history-empty">Your calculations will appear here.</p>
    </aside>

  </div>
</body>
</html>
